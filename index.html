<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ニコニコ動画と YouTube のウマ娘音MADをまとめて探せるサイト" />
    <title>ウマ娘 音MAD まとめ</title>
    <!-- Twitter などに貼ったときのカード。__SITE_URL__ はビルド時に vite.config.ts が公開 URL に置き換える -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ウマ娘 音MAD まとめ" />
    <meta property="og:title" content="ウマ娘 音MAD まとめ" />
    <meta property="og:description" content="ニコニコ動画と YouTube のウマ娘音MADを毎日自動でまとめています。キャラや投稿者で絞り込んで、再生しながら次の動画を選べます。" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f25f4c'/%3E%3Cpath d='M12 9v11.5a3.5 3.5 0 1 0 2 3.2V13l8-2v7.5a3.5 3.5 0 1 0 2 3.2V7z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-top">
        <h1 class="logo"><a id="home" href="./">ウマ娘 音MAD まとめ</a></h1>
        <a id="playlists-link" class="playlists-link" href="?view=playlists">プレイリスト</a>
      </div>
      <div class="controls">
        <input id="q" type="search" placeholder="タイトル・キャラ・タグで検索" aria-label="キーワード検索" />
        <div class="combo">
          <input id="chara" placeholder="キャラで絞り込み" aria-label="キャラで絞り込み" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="chara-list" aria-autocomplete="list" />
          <button class="combo-clear" type="button" aria-label="キャラの絞り込みを解除" hidden>✕</button>
          <ul id="chara-list" class="combo-list" role="listbox" hidden></ul>
        </div>
        <div class="combo">
          <input id="author" placeholder="投稿者で絞り込み" aria-label="投稿者で絞り込み" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="author-list" aria-autocomplete="list" />
          <button class="combo-clear" type="button" aria-label="投稿者の絞り込みを解除" hidden>✕</button>
          <ul id="author-list" class="combo-list" role="listbox" hidden></ul>
        </div>
        <select id="src" aria-label="取得元">
          <option value="all">すべて</option>
          <option value="nico">ニコ動</option>
          <option value="youtube">YouTube</option>
        </select>
        <div class="sort-group">
          <select id="sort" aria-label="並び順">
            <option value="new">投稿日時</option>
            <option value="views">再生数</option>
            <option value="likes">いいね数</option>
            <option value="duration">再生時間</option>
          </select>
          <button id="order" class="order" type="button"></button>
        </div>
      </div>
    </header>

    <main>
      <section id="playlists" class="playlists" hidden></section>

      <section id="browse">
        <p id="count" class="count"></p>
        <div id="grid" class="grid"></div>
        <p id="empty" class="empty" hidden>見つかりませんでした</p>
        <button id="more" class="more" type="button" hidden>もっと見る</button>
      </section>

      <section id="watch" class="watch" hidden>
        <div class="watch-main">
          <div id="watch-frame" class="watch-frame"></div>
          <h2 id="watch-title" class="watch-title"></h2>
          <p id="watch-author-name" class="author"></p>
          <p id="watch-meta" class="meta"></p>
          <p id="watch-charas" class="charas"></p>
          <div class="watch-actions">
            <button id="watch-back" class="btn-ghost" type="button">← 一覧に戻る</button>
            <a id="watch-link" class="watch-link" target="_blank" rel="noopener">元のページで見る ↗</a>
            <button id="watch-author" class="btn-accent" type="button" hidden></button>
            <button id="watch-save" class="btn-ghost" type="button" aria-expanded="false" aria-controls="save-panel">＋ 保存</button>
            <label class="switch"><input id="autoplay" type="checkbox" /> 連続再生</label>
          </div>
          <div id="save-panel" class="save-panel" hidden></div>
        </div>
        <aside class="watch-side">
          <div id="upnext-side">
            <h3 class="watch-side-title">次に見る <span id="watch-count" class="count"></span></h3>
            <div id="watch-list" class="watch-list"></div>
            <p id="watch-empty" class="empty" hidden>ほかに動画がありません</p>
            <button id="watch-more" class="more" type="button" hidden>もっと見る</button>
          </div>
          <div id="playlist-side" hidden>
            <h3 id="playlist-title" class="watch-side-title"></h3>
            <p id="playlist-mode" class="pl-note"></p>
            <div id="playlist-list" class="watch-list"></div>
          </div>
        </aside>
      </section>
    </main>

    <footer class="footer">
      <p>各動画の権利は投稿者に帰属します。</p>
      <p>
        <span id="updated"></span>
        <a id="issues" target="_blank" rel="noopener" hidden>掲載の取り下げ依頼</a>
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
